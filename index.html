
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GYRADIO — Memory Jukebox</title>
<style>
  :root {
    --bg: #fbf5ea;
    --ink: #1f1a14;
    --muted: #6b5f50;
    --card: #ffffff;
    --line: #e0d3bf;
    --accent: #8a4b12;
    --accent-ink: #ffffff;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 24px 18px 56px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    font-size: 20px;
    line-height: 1.5;
  }

  main {
    max-width: 560px;
    margin: 0 auto;
  }

  header { text-align: center; margin-bottom: 28px; }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 9vw, 2.75rem);
    letter-spacing: 0.14em;
    font-weight: 800;
  }

  .tagline {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 1.05rem;
    letter-spacing: 0.06em;
  }

  h2 {
    font-size: 1.05rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 700;
  }

  .now {
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 16px;
  }

  #nowTitle {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
    word-break: break-word;
  }

  #nowTitle.empty { color: var(--muted); font-weight: 400; }

  .player {
    position: relative;
    height: 172px;
    margin-bottom: 22px;
  }

  .player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: var(--radius);
    background: var(--card);
  }

  .controls {
    display: grid;
    gap: 14px;
    margin-bottom: 34px;
  }

  button {
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    min-height: 64px;
    padding: 14px 20px;
    border-radius: var(--radius);
    border: 3px solid transparent;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
  }

  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }

  button:focus-visible,
  .fav-title:focus-visible,
  .fav-remove:focus-visible {
    outline: 4px solid var(--ink);
    outline-offset: 3px;
  }

  button:disabled {
    background: #cbbca6;
    color: #4a3f33;
    cursor: default;
    filter: none;
  }

  .favorites { margin-bottom: 20px; }

  #favList {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }

  .fav-item {
    display: flex;
    align-items: stretch;
    gap: 10px;
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: var(--radius);
    padding: 8px;
  }

  .fav-title {
    flex: 1;
    text-align: left;
    background: transparent;
    color: var(--ink);
    font-size: 1.1rem;
    font-weight: 600;
    min-height: 56px;
    padding: 10px 12px;
    border: 0;
  }

  .fav-title:hover { filter: none; text-decoration: underline; }

  .fav-remove {
    flex: 0 0 auto;
    width: 56px;
    min-height: 56px;
    background: transparent;
    color: var(--muted);
    border: 3px solid var(--line);
    font-size: 1.3rem;
    padding: 0;
  }

  .fav-remove:hover { color: var(--ink); background: #f4ebdc; filter: none; }

  .empty-note {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
  }

  #status {
    margin: 18px 0 0;
    min-height: 1.5em;
    color: var(--muted);
    font-size: 1rem;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    button:active { transform: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>GYRADIO</h1>
    <p class="tagline">Memory Jukebox</p>
  </header>

  <section class="now" aria-live="polite">
    <h2>Now Playing</h2>
    <p id="nowTitle" class="empty">Press Surprise Me</p>
  </section>

  <div id="playerHost" class="player" aria-hidden="false"></div>

  <div class="controls">
    <button id="surpriseBtn" type="button">Surprise Me</button>
    <button id="favBtn" type="button">Add To Favorites</button>
  </div>

  <section class="favorites">
    <h2 id="favHeading">Favorites (0)</h2>
    <ul id="favList"></ul>
    <p id="favEmpty" class="empty-note">No favorites saved yet.</p>
  </section>

  <p id="status" role="status"></p>
</main>

<script>
(function () {
  "use strict";

  // ---- Config -------------------------------------------------------------
  // Point these at whatever the next JSON file is called; the catalog shape
  // is [{ id, title }, ...] so extra files can be added later without change.
  var CATALOG_URL = "./data/gy_radio_bumpers.json";
  var FAV_KEY = "gyradio.favorites.v1";
  var AUTOPLAY_PARAM = "?autoplay=1"; // remove if Suno ignores/mangles it

  // ---- Elements -----------------------------------------------------------
  var host = document.getElementById("playerHost");
  var nowTitle = document.getElementById("nowTitle");
  var surpriseBtn = document.getElementById("surpriseBtn");
  var favBtn = document.getElementById("favBtn");
  var favList = document.getElementById("favList");
  var favHeading = document.getElementById("favHeading");
  var favEmpty = document.getElementById("favEmpty");
  var statusEl = document.getElementById("status");

  // ---- State --------------------------------------------------------------
  var catalog = [];
  var current = null;   // { id, title }
  var currentFrame = null;
  var statusTimer = null;

  function say(msg) {
    statusEl.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { statusEl.textContent = ""; }, 2600);
  }

  // ---- Storage ------------------------------------------------------------
  function readFavs() {
    try {
      var raw = JSON.parse(localStorage.getItem(FAV_KEY));
      return Array.isArray(raw) ? raw.filter(function (f) {
        return f && typeof f.id === "string" && typeof f.title === "string";
      }) : [];
    } catch (e) {
      return [];
    }
  }

  function writeFavs(list) {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(list));
    } catch (e) {
      say("Couldn't save — storage may be full.");
    }
    renderFavs();
  }

  function isFaved(id) {
    return readFavs().some(function (f) { return f.id === id; });
  }

  // ---- Player -------------------------------------------------------------
  function buildFrame(song) {
    var f = document.createElement("iframe");
    f.src = "https://suno.com/embed/" + encodeURIComponent(song.id) + AUTOPLAY_PARAM;
    f.title = "Song player: " + song.title;
    f.setAttribute("allow", "autoplay; fullscreen; encrypted-media");
    f.setAttribute("frameborder", "0");
    f.setAttribute("scrolling", "no");
    f.loading = "eager";
    f.style.visibility = "hidden";
    return f;
  }

  function loadSong(song) {
    if (!song || !song.id) return;

    current = { id: song.id, title: song.title };
    nowTitle.textContent = song.title;
    nowTitle.classList.remove("empty");
    syncFavButton();

    // Build the replacement hidden, swap it in once it has loaded so the
    // viewer never sees a blank frame.
    var next = buildFrame(song);
    host.appendChild(next);

    var revealed = false;
    function reveal() {
      if (revealed || !next.isConnected) return;
      revealed = true;
      Array.prototype.forEach.call(host.children, function (child) {
        if (child !== next) child.remove();
      });
      currentFrame = next;
      next.style.visibility = "visible";
    }

    next.addEventListener("load", reveal, { once: true });
    setTimeout(reveal, 3000); // fallback if the load event never fires
  }

  // ---- Surprise Me --------------------------------------------------------
  function surprise() {
    if (!catalog.length) {
      say("Song list not loaded yet.");
      return;
    }
    var pool = catalog.filter(function (s) {
      return !current || s.id !== current.id;
    });
    if (!pool.length) pool = catalog;
    loadSong(pool[Math.floor(Math.random() * pool.length)]);
  }

  // ---- Favorites ----------------------------------------------------------
  function syncFavButton() {
    var saved = current ? isFaved(current.id) : false;
    favBtn.disabled = !current || saved;
    favBtn.textContent = saved ? "In Favorites" : "Add To Favorites";
  }

  function addFavorite() {
    if (!current) return;
    var list = readFavs();
    if (list.some(function (f) { return f.id === current.id; })) return;
    list.push({ id: current.id, title: current.title });
    writeFavs(list);
    syncFavButton();
    say("Saved to favorites.");
  }

  function removeFavorite(id) {
    writeFavs(readFavs().filter(function (f) { return f.id !== id; }));
    syncFavButton();
    say("Removed from favorites.");
  }

  function renderFavs() {
    var list = readFavs();
    favList.textContent = "";
    favHeading.textContent = "Favorites (" + list.length + ")";
    favEmpty.hidden = list.length > 0;

    list.forEach(function (fav) {
      var li = document.createElement("li");
      li.className = "fav-item";

      var play = document.createElement("button");
      play.type = "button";
      play.className = "fav-title";
      play.textContent = fav.title;
      play.addEventListener("click", function () {
        loadSong({ id: fav.id, title: fav.title });
      });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "fav-remove";
      del.textContent = "\u2715";
      del.setAttribute("aria-label", "Remove " + fav.title + " from favorites");
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        removeFavorite(fav.id);
      });

      li.appendChild(play);
      li.appendChild(del);
      favList.appendChild(li);
    });
  }

  // ---- Boot ---------------------------------------------------------------
  surpriseBtn.addEventListener("click", surprise);
  favBtn.addEventListener("click", addFavorite);

  renderFavs();
  syncFavButton();

  fetch(CATALOG_URL, { cache: "no-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      if (!Array.isArray(data)) throw new Error("Bad catalog shape");
      catalog = data.filter(function (s) {
        return s && typeof s.id === "string" && typeof s.title === "string";
      });
      if (!catalog.length) throw new Error("Catalog empty");
      loadSong(catalog[0]);
    })
    .catch(function () {
      nowTitle.textContent = "Song list unavailable";
      say("Couldn't load the songs. Check the connection and reload the page.");
    });
})();
</script>
</body>
</html>
