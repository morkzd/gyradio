<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080c">
<title>GYRADIO — Memory Jukebox</title>
<style>
  :root {
    --bg: #08080c;
    --panel: #101018;
    --ink: #eaf6ff;
    --muted: #8fa3b8;
    --blue: #8fd6ff;
    --pink: #ff9ed2;
    --line: #24303d;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 26px 18px 60px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    font-size: 20px;
    line-height: 1.5;
    /* faint blue/pink wash so the black doesn't read as flat */
    background-image:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(143, 214, 255, 0.10), transparent 70%),
      radial-gradient(ellipse 70% 40% at 50% 100%, rgba(255, 158, 210, 0.09), transparent 70%);
    background-attachment: fixed;
  }

  main { max-width: 560px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 30px; }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 9vw, 2.75rem);
    letter-spacing: 0.16em;
    font-weight: 800;
    background: linear-gradient(90deg, var(--blue), var(--pink), var(--blue));
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: shimmer 7s linear infinite;
    filter: drop-shadow(0 0 14px rgba(143, 214, 255, 0.35));
  }

  .tagline {
    margin: 8px 0 0;
    color: var(--pink);
    font-size: 1.05rem;
    letter-spacing: 0.14em;
    text-shadow: 0 0 12px rgba(255, 158, 210, 0.5);
  }

  h2 {
    font-size: 1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--blue);
    margin: 0 0 10px;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(143, 214, 255, 0.35);
  }

  .now {
    background: var(--panel);
    border: 2px solid var(--pink);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: 0 0 20px rgba(255, 158, 210, 0.18), inset 0 0 22px rgba(255, 158, 210, 0.06);
  }

  #nowTitle {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
    word-break: break-word;
    text-shadow: 0 0 16px rgba(143, 214, 255, 0.3);
  }

  #nowTitle.empty { color: var(--muted); font-weight: 400; text-shadow: none; }

  .player {
    position: relative;
    height: 260px;
    margin-bottom: 12px;
    border-radius: var(--radius);
    animation: breathe 6s ease-in-out infinite;
  }

  .player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: var(--radius);
    background: var(--panel);
  }

  #sunoLink {
    margin: 0 0 24px;
    text-align: center;
    font-size: 1rem;
  }

  #sunoLink a { color: var(--blue); text-decoration: none; border-bottom: 1px solid rgba(143, 214, 255, 0.5); }
  #sunoLink a:hover { color: var(--pink); border-bottom-color: var(--pink); }

  .controls { display: grid; gap: 14px; margin-bottom: 36px; }

  button {
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    min-height: 66px;
    padding: 14px 20px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    cursor: pointer;
    color: #05070a;
    transition: box-shadow 0.2s ease, transform 0.06s ease;
  }

  #surpriseBtn {
    background: linear-gradient(180deg, #b6e6ff, var(--blue));
    box-shadow: 0 0 18px rgba(143, 214, 255, 0.4);
  }

  #favBtn {
    background: linear-gradient(180deg, #ffc2e0, var(--pink));
    box-shadow: 0 0 18px rgba(255, 158, 210, 0.4);
  }

  #surpriseBtn:hover { box-shadow: 0 0 28px rgba(143, 214, 255, 0.75); }
  #favBtn:hover { box-shadow: 0 0 28px rgba(255, 158, 210, 0.75); }

  button:active { transform: translateY(1px); }

  button:focus-visible,
  .fav-title:focus-visible,
  .fav-remove:focus-visible,
  a:focus-visible {
    outline: 4px solid var(--ink);
    outline-offset: 3px;
  }

  button:disabled {
    background: #232b34;
    color: #7f8d9c;
    box-shadow: none;
    cursor: default;
  }

  .favorites { margin-bottom: 20px; }

  #favList { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

  .fav-item {
    display: flex;
    align-items: stretch;
    gap: 10px;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 8px;
  }

  .fav-item:hover { border-color: var(--blue); box-shadow: 0 0 16px rgba(143, 214, 255, 0.25); }

  .fav-title {
    flex: 1;
    text-align: left;
    background: transparent;
    color: var(--ink);
    font-size: 1.1rem;
    font-weight: 600;
    min-height: 56px;
    padding: 10px 12px;
    border: 0;
    box-shadow: none;
  }

  .fav-title:hover { color: var(--blue); box-shadow: none; }

  .fav-remove {
    flex: 0 0 auto;
    width: 56px;
    min-height: 56px;
    background: transparent;
    color: var(--pink);
    border: 2px solid var(--line);
    font-size: 1.3rem;
    padding: 0;
    box-shadow: none;
  }

  .fav-remove:hover { border-color: var(--pink); color: #fff; box-shadow: 0 0 16px rgba(255, 158, 210, 0.5); }

  .empty-note { margin: 0; color: var(--muted); font-size: 1.05rem; }

  #status {
    margin: 18px 0 0;
    min-height: 1.5em;
    color: var(--pink);
    font-size: 1rem;
    text-align: center;
  }

  @keyframes shimmer {
    from { background-position: 0% center; }
    to { background-position: 220% center; }
  }

  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 16px rgba(143, 214, 255, 0.22); }
    50% { box-shadow: 0 0 34px rgba(255, 158, 210, 0.45); }
  }

  @media (prefers-reduced-motion: reduce) {
    h1, .player { animation: none; }
    button:active { transform: none; }
    .player { box-shadow: 0 0 20px rgba(143, 214, 255, 0.25); }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>GYRADIO</h1>
    <p class="tagline">Memory Jukebox</p>
  </header>

  <section class="now" aria-live="polite">
    <h2>Now Playing</h2>
    <p id="nowTitle" class="empty">Press Surprise Me</p>
  </section>

  <div id="playerHost" class="player"></div>

  <p id="sunoLink"><a id="sunoAnchor" href="https://suno.com" target="_blank" rel="noopener">Open this song on Suno</a></p>

  <div class="controls">
    <button id="surpriseBtn" type="button">Surprise Me</button>
    <button id="favBtn" type="button">Add To Favorites</button>
  </div>

  <section class="favorites">
    <h2 id="favHeading">Favorites (0)</h2>
    <ul id="favList"></ul>
    <p id="favEmpty" class="empty-note">No favorites saved yet.</p>
  </section>

  <p id="status" role="status"></p>
</main>

<script>
(function () {
  "use strict";

  var CATALOG_URL = "/data/gy_radio_bumpers.json";
  var FAV_KEY = "gyradio.favorites.v1";

  var host = document.getElementById("playerHost");
  var nowTitle = document.getElementById("nowTitle");
  var surpriseBtn = document.getElementById("surpriseBtn");
  var favBtn = document.getElementById("favBtn");
  var favList = document.getElementById("favList");
  var favHeading = document.getElementById("favHeading");
  var favEmpty = document.getElementById("favEmpty");
  var statusEl = document.getElementById("status");
  var sunoAnchor = document.getElementById("sunoAnchor");

  var catalog = [];
  var current = null;
  var frame = null;
  var statusTimer = null;

  function say(msg) {
    statusEl.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { statusEl.textContent = ""; }, 2600);
  }

  // ---- Storage ------------------------------------------------------------
  function readFavs() {
    try {
      var raw = JSON.parse(localStorage.getItem(FAV_KEY));
      return Array.isArray(raw) ? raw.filter(function (f) {
        return f && typeof f.id === "string" && typeof f.title === "string";
      }) : [];
    } catch (e) {
      return [];
    }
  }

  function writeFavs(list) {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(list));
    } catch (e) {
      say("Couldn't save — storage may be full.");
    }
    renderFavs();
  }

  function isFaved(id) {
    return readFavs().some(function (f) { return f.id === id; });
  }

  // ---- Player -------------------------------------------------------------
  function loadSong(song) {
    if (!song || !song.id) return;

    current = { id: song.id, title: song.title };
    nowTitle.textContent = song.title;
    nowTitle.classList.remove("empty");
    syncFavButton();

    var url = "https://suno.com/embed/" + encodeURIComponent(song.id);
    sunoAnchor.href = "https://suno.com/song/" + encodeURIComponent(song.id);

    if (!frame) {
      frame = document.createElement("iframe");
      frame.setAttribute("allow", "autoplay; fullscreen; encrypted-media");
      frame.setAttribute("frameborder", "0");
      frame.title = "Song player";
      host.appendChild(frame);
    }
    frame.src = url;
  }

  // ---- Surprise Me --------------------------------------------------------
  function surprise() {
    if (!catalog.length) {
      say("Song list not loaded yet.");
      return;
    }
    var pool = catalog.filter(function (s) { return !current || s.id !== current.id; });
    if (!pool.length) pool = catalog;
    loadSong(pool[Math.floor(Math.random() * pool.length)]);
  }

  // ---- Favorites ----------------------------------------------------------
  function syncFavButton() {
    var saved = current ? isFaved(current.id) : false;
    favBtn.disabled = !current || saved;
    favBtn.textContent = saved ? "In Favorites" : "Add To Favorites";
  }

  function addFavorite() {
    if (!current) return;
    var list = readFavs();
    if (list.some(function (f) { return f.id === current.id; })) return;
    list.push({ id: current.id, title: current.title });
    writeFavs(list);
    syncFavButton();
    say("Saved to favorites.");
  }

  function removeFavorite(id) {
    writeFavs(readFavs().filter(function (f) { return f.id !== id; }));
    syncFavButton();
    say("Removed from favorites.");
  }

  function renderFavs() {
    var list = readFavs();
    favList.textContent = "";
    favHeading.textContent = "Favorites (" + list.length + ")";
    favEmpty.hidden = list.length > 0;

    list.forEach(function (fav) {
      var li = document.createElement("li");
      li.className = "fav-item";

      var play = document.createElement("button");
      play.type = "button";
      play.className = "fav-title";
      play.textContent = fav.title;
      play.addEventListener("click", function () {
        loadSong({ id: fav.id, title: fav.title });
      });

      var del = document.createElement("button");
      del.type = "button";
      del.className = "fav-remove";
      del.textContent = "\u2715";
      del.setAttribute("aria-label", "Remove " + fav.title + " from favorites");
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        removeFavorite(fav.id);
      });

      li.appendChild(play);
      li.appendChild(del);
      favList.appendChild(li);
    });
  }

  // ---- Boot ---------------------------------------------------------------
  surpriseBtn.addEventListener("click", surprise);
  favBtn.addEventListener("click", addFavorite);

  renderFavs();
  syncFavButton();

  fetch(CATALOG_URL, { cache: "no-cache" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function (text) {
      var body = text.trim()
        .replace(/^(?:const|let|var)\s+[A-Za-z0-9_$]+\s*=\s*/, "")
        .replace(/;\s*$/, "");
      var data = JSON.parse(body);
      if (!Array.isArray(data)) throw new Error("Bad catalog shape");
      catalog = data.filter(function (s) {
        return s && typeof s.id === "string" && typeof s.title === "string";
      });
      if (!catalog.length) throw new Error("Catalog empty");
      loadSong(catalog[0]);
    })
    .catch(function () {
      nowTitle.textContent = "Song list unavailable";
      say("Couldn't load the songs. Check the connection and reload the page.");
    });
})();
</script>
</body>
</html>
