<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Funny Skits</title>

  <style>
    :root {
      --blue: #4a5cff;
      --yellow: #ffd447;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--blue);
      overflow: hidden;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #video-container {
      flex: 0 0 85vh;
      width: 100vw;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    #controls {
      flex: 0 0 auto;
      width: 100vw;
      background: var(--blue);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 14px 0;
    }

    button {
      background: var(--yellow);
      color: var(--blue);
      border: none;
      padding: 18px 34px;
      font-size: 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    button:active {
      opacity: 0.8;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      z-index: 9999;
    }
  </style>
</head>

<body>

  <div id="loading">Loading…</div>

  <div id="video-container">
    <div id="player"></div>
  </div>

  <div id="controls">
    <button id="backBtn">Back</button>
    <button id="shuffleBtn">Shuffle</button>
    <button id="nextBtn">Next</button>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let videos = [];
    let index = 0;
    let player;
    let jsonLoaded = false;
    let playerReady = false;

    // Load JSON
    fetch("funny.json")
      .then(res => res.json())
      .then(data => {
        videos = data.videos;
        jsonLoaded = true;
        tryStart();
      })
      .catch(err => {
        console.error("JSON error:", err);
        alert("Could not load video list.");
      });

    // YouTube API callback
    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        height: "100%",
        width: "100%",
        videoId: "",
        playerVars: {
          playsinline: 1,
          cc_load_policy: 1
        },
        events: {
          onReady: () => {
            playerReady = true;
            tryStart();
          }
        }
      });
    }

    // Start only when JSON + Player are ready
    function tryStart() {
      if (jsonLoaded && playerReady) {
        document.getElementById("loading").style.display = "none";
        loadVideo();
      }
    }

    function loadVideo() {
      const url = videos[index];
      if (!url) return;

      const videoId = url.split("/embed/")[1];

      player.loadVideoById(videoId);

      // ALWAYS UNMUTE
      player.unMute();
    }

    // Buttons
    document.getElementById("nextBtn").addEventListener("click", () => {
      index = (index + 1) % videos.length;
      loadVideo();
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      index = (index - 1 + videos.length) % videos.length;
      loadVideo();
    });

    document.getElementById("shuffleBtn").addEventListener("click", () => {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * videos.length);
      } while (newIndex === index);

      index = newIndex;
      loadVideo();
    });

    // Keyboard controls
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") {
        index = (index + 1) % videos.length;
        loadVideo();
      }
      if (e.key === "ArrowLeft") {
        index = (index - 1 + videos.length) % videos.length;
        loadVideo();
      }
      if (e.key === " ") {
        player.unMute();
      }
    });
  </script>

</body>
</html>
